{% extends "base.html" %}
{% block title %}Conversion Error — FileForge{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-24 text-center">
  <div class="w-16 h-16 rounded-2xl bg-red-900/30 border border-red-800 flex items-center justify-center text-2xl mx-auto mb-6">
    ⚠️
  </div>
  <h1 class="font-display text-3xl font-700 text-white mb-3">Conversion Failed</h1>
  <p class="text-muted mb-8">Something went wrong while processing your file.</p>

  <div class="text-left bg-panel border border-red-900/50 rounded-xl p-5 mb-8">
    <p class="font-mono text-xs text-red-400 whitespace-pre-wrap break-all">{{ error }}</p>
  </div>

  <a href="javascript:history.back()"
     class="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-panel border border-border text-white font-display font-600 hover:border-accent transition-colors">
    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
    </svg>
    Go back and try again
  </a>
</div>
{% endblock %}
