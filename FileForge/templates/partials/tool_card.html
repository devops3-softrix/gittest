{% comment %}
  Expects: tool.name, tool.description, tool.url, tool.icon, color
  Cards are always visible — no opacity animations that could leave them invisible.
{% endcomment %}
<div class="tool-card-wrapper" data-title="{{ tool.name|lower }}">
  <a href="{{ tool.url }}" class="tool-card block rounded-xl p-4 no-underline">
    <!-- Icon + arrow row -->
    <div class="flex items-start justify-between mb-3">
      <span style="font-size:1.25rem; line-height:1;">{{ tool.icon }}</span>
      <svg class="card-arrow flex-shrink-0 mt-0.5"
           style="width:14px;height:14px;"
           fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M7 17L17 7M17 7H7M17 7v10"/>
      </svg>
    </div>
    <!-- Title — always white -->
    <div class="card-title text-sm leading-tight mb-1">{{ tool.name }}</div>
    <!-- Description — always visible grey -->
    <div class="card-desc text-xs leading-snug"
         style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">
      {{ tool.description }}
    </div>
    <!-- Colour accent bar (CSS hover only — no JS) -->
    <div class="card-bar mt-3 {% if color == 'red' %}bar-red{% elif color == 'blue' %}bar-blue{% elif color == 'purple' %}bar-purple{% elif color == 'green' %}bar-green{% elif color == 'orange' %}bar-orange{% elif color == 'teal' %}bar-teal{% else %}bar-yellow{% endif %}"></div>
  </a>
</div>
